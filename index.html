<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Asset Manager</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        h2 { text-align: center; color: #333; }
        
        /* কন্টেইনার ডিজাইন */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }

        /* প্রতিটি কার্ডের ডিজাইন */
        .card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            word-wrap: break-word;
        }

        /* প্রিভিউ এরিয়া */
        .preview {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            margin-bottom: 10px;
            border-radius: 4px;
            overflow: hidden;
        }
        img { max-width: 100%; max-height: 100%; }
        video { max-width: 100%; max-height: 100%; }

        /* বাটন ডিজাইন */
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { background: #0056b3; }
        .folder-btn {
            background: #28a745; margin: 5px; width: auto;
        }
    </style>
</head>
<body>

    <h2>📂 My Asset Dashboard</h2>
    
    <div id="folder-nav" style="text-align: center; margin-bottom: 20px;">
        <button onclick="loadFiles('')" class="folder-btn">🏠 Home</button>
        <button onclick="loadFiles('images')" class="folder-btn">🖼 Images</button>
        <button onclick="loadFiles('videos')" class="folder-btn">🎬 Videos</button>
        <button onclick="loadFiles('audio')" class="folder-btn">🎵 Audio</button>
    </div>

    <div id="file-list" class="gallery">
        <p style="text-align:center; width:100%">লোডিং হচ্ছে...</p>
    </div>

    <script>
        // ==========================================
        // 🛠 আপনার সেটিংস এখানে পরিবর্তন করুন
        // ==========================================
        const CONFIG = {
            username: 'nabendudebnathbharatiya-bot',  // এখানে আপনার username দিন
            repo: 'my-app-assets',              // আপনার repo-র নাম দিন
            branch: 'main'                      // সাধারণত main অথবা master হয়
        };

        // GitHub API লিংক তৈরি
        const apiBase = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/`;
        const webBase = `https://{CONFIG.username}.github.io/${CONFIG.repo}/`;

        async function loadFiles(folderPath) {
            const container = document.getElementById('file-list');
            container.innerHTML = '<p>লোডিং...</p>';

            try {
                // GitHub API থেকে লিস্ট আনা হচ্ছে
                const response = await fetch(apiBase + folderPath);
                
                if (!response.ok) {
                    container.innerHTML = '<p style="color:red">ফোল্ডার পাওয়া যাচ্ছে না বা খালি!</p>';
                    return;
                }

                const data = await response.json();
                container.innerHTML = ''; // আগের লিস্ট ক্লিয়ার করা

                data.forEach(file => {
                    // শুধুমাত্র ফাইলগুলো দেখাবো (ফোল্ডার নয়)
                    if (file.type === 'file') {
                        createCard(file, folderPath);
                    }
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<p>এই ফোল্ডারে কোনো ফাইল নেই।</p>';
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p>ডাটা লোড করতে সমস্যা হয়েছে।</p>';
            }
        }

        function createCard(file, folderPath) {
            // ডাইরেক্ট লিংক তৈরি (GitHub Pages URL)
            // ফরম্যাট: https://user.github.io/repo/folder/file
            const pathFix = folderPath ? folderPath + '/' : '';
            const directLink = `https://${CONFIG.username}.github.io/${CONFIG.repo}/${pathFix}${file.name}`;

            let mediaPreview = '';
            const ext = file.name.split('.').pop().toLowerCase();

            // ফাইলের টাইপ অনুযায়ী প্রিভিউ তৈরি
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                mediaPreview = `<img src="${directLink}" alt="img">`;
            } else if (['mp4', 'webm'].includes(ext)) {
                mediaPreview = `<video controls src="${directLink}"></video>`;
            } else if (['mp3', 'wav'].includes(ext)) {
                mediaPreview = `<audio controls src="${directLink}" style="width:100%"></audio>`;
            } else {
                mediaPreview = `<span style="font-size:40px">📄</span>`;
            }

            // HTML কার্ড তৈরি
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="preview">${mediaPreview}</div>
                <div style="font-weight:bold; font-size:14px; margin-bottom:5px;">${file.name}</div>
                <button onclick="copyLink('${directLink}')">📋 Copy Link</button>
                <a href="${directLink}" target="_blank" style="display:block; margin-top:5px; font-size:12px;">View Original</a>
            `;

            document.getElementById('file-list').appendChild(card);
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('লিংক কপি হয়েছে: ' + url);
            });
        }

        // পেজ লোড হলে প্রথমে রুট ফোল্ডার লোড হবে
        loadFiles(''); 
    </script>
</body>
</html>
